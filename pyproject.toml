[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minesweeper"
description = "Campo Minado Probabilístico: agentes que jogam Campo Minado pelo terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]
dynamic = ["version"]

[project.scripts]
minesweeper = "minesweeper.cli:main"

[tool.setuptools.dynamic]
version = { attr = "minesweeper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
